<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>DevPulse · CI diagnostics</title>
<style>body{font-family:system-ui;background:#101827;color:#e7edf4;margin:0;padding:34px}main{max-width:960px;margin:auto}.cards{display:flex;gap:14px;flex-wrap:wrap}.card{background:#202c40;padding:22px;border-radius:10px;min-width:140px}strong{font-size:32px;display:block}input,button{font:inherit;padding:11px;border:0;border-radius:6px}button{background:#57b4f7;cursor:pointer}pre{white-space:pre-wrap;background:#202c40;padding:20px;border-radius:8px;line-height:1.5}small{color:#acb8cb}</style></head><body><main><h1>DevPulse</h1><p>CI failure triage and graph-based test selection</p><div class="cards"><div class="card"><strong id="runs">–</strong>CI runs</div><div class="card"><strong id="fails">–</strong>Failures</div><div class="card"><strong id="svc">–</strong>Services</div></div><h2>Find affected tests</h2><p><small>Try module-4,module-7</small></p><input id="mods" value="module-4,module-7"/><button onclick="impact()">Find tests</button><pre id="output">Loading…</pre><p><small>Synthetic demonstration data. This is not a ByteDance system.</small></p></main><script>
async function load(){try{const m=await(await fetch('/api/metrics')).json();document.getElementById('runs').textContent=m.total;document.getElementById('fails').textContent=m.failed;document.getElementById('svc').textContent=Object.keys(m.byService).length;await impact()}catch(e){document.getElementById('output').textContent=String(e)}}
async function impact(){const m=document.getElementById('mods').value;const x=await(await fetch('/api/impact?modules='+encodeURIComponent(m))).json();document.getElementById('output').textContent=JSON.stringify(x,null,2)}load();</script></body></html>
