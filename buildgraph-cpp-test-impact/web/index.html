<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>BuildGraph · C++ Dependency Explorer</title><style>body{margin:0;background:#131c29;color:#e9f0fb;font-family:system-ui;padding:40px}main{max-width:890px;margin:auto}header{background:#202e43;padding:25px;border-radius:12px}.count{font-size:30px;font-weight:bold}input,button{padding:12px;font:inherit;border:0;border-radius:6px}input{width:240px}button{background:#80dbb7;cursor:pointer}pre{padding:20px;background:#202e43;border-radius:12px;white-space:pre-wrap}small{color:#9cb1c8}</style></head><body><main><header><h1>BuildGraph</h1><p>Test impact analysis powered by a C++ dependency graph</p><p id="stats">Loading graph statistics…</p></header><h2>Trace a changed module</h2><input id="changed" value="module-7"/><button onclick="trace()">Select tests</button><pre id="result"></pre><p><small>Independent prototype • Synthetic dependency graph • Not an AI model</small></p></main><script>async function trace(){const changed=document.getElementById('changed').value;const data=await(await fetch('/api/impact?modules='+encodeURIComponent(changed))).json();document.getElementById('result').textContent=JSON.stringify(data,null,2)}(async()=>{try{const s=await(await fetch('/api/stats')).json();document.getElementById('stats').textContent=`${s.modules} modules · ${s.tests} tests · ${s.dependencies} dependency edges`;await trace()}catch(e){document.getElementById('stats').textContent=e.message}})()</script></body></html>
